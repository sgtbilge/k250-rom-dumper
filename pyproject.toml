[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k250-rom-dumper"
version = "1.0.0"
description = "Standalone 68000 EPROM firmware and cross-platform MIDI SysEx tools to dump and verify Kurzweil K250 Sound & OS ROMs without desoldering."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Peter Washburn" }
]
requires-python = ">=3.9"
keywords = ["kurzweil", "k250", "eprom", "rom-dumper", "midi", "sysex", "m68k", "synthesizer", "preservation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
midi = ["python-rtmidi>=1.5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
k250-dump = "k250_rom_dumper.cli:main"

[project.urls]
Homepage = "https://github.com/sgtbilge/k250-rom-dumper"
Repository = "https://github.com/sgtbilge/k250-rom-dumper"
Issues = "https://github.com/sgtbilge/k250-rom-dumper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
